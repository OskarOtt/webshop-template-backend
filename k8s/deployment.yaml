apiVersion: apps/v1
kind: Deployment
metadata:
  name: webshop-backend
  labels:
    app: webshop-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webshop-backend
  template:
    metadata:
      labels:
        app: webshop-backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: webshop-backend
          # Image published by .github/workflows/deploy.yml on push to main
          image: ghcr.io/oskarott/webshop-template-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: webshop-backend-config
            - secretRef:
                name: webshop-backend-secret
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
