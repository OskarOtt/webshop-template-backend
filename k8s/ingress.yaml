apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webshop-backend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - webshop.api.oskott.com
      secretName: webshop-backend-tls
  rules:
    - host: webshop.api.oskott.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webshop-backend
                port:
                  number: 8080
